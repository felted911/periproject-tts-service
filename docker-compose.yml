version: '3.8'

services:
  tts-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peri-tts-service
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - ENVIRONMENT=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - KOKORO_USE_GPU=false
    restart: unless-stopped
