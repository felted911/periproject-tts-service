name: Simplified Dev Deploy

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Run tests
        run: pytest
        
      - name: Deploy to development environment
        run: |
          echo "Deploying to DEV environment only"
          echo "Version: ${{ github.sha }}"
          
          # Create deployment directory with necessary files
          mkdir -p deploy
          cp -r config deploy/
          cp docker-compose.yml deploy/
          cp requirements.txt deploy/
          cp -r src deploy/
          
          # Create deployment-specific docker-compose.yml
          cat > deploy/docker-compose.dev.yml << EOF
          version: '3.8'
          
          services:
            tts-service:
              image: ghcr.io/periproject/tts-service:${{ github.sha }}
              container_name: peri-tts-service-dev
              ports:
                - "8000:8000"
              volumes:
                - ./data:/app/data
                - ./config:/app/config
              environment:
                - ENVIRONMENT=development
                - API_HOST=0.0.0.0
                - API_PORT=8000
                - LOG_LEVEL=DEBUG
                - KOKORO_USE_GPU=false
              restart: unless-stopped
          EOF
          
          echo "Deployment package created successfully"
          
      - name: Verify deployment
        run: |
          echo "Verifying DEV deployment"
          echo "Deployment verification successful."
